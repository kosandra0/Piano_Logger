name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "app-v6.0" desktop/dist/Piano-Logger-Setup.exe --latest --title "Piano Logger app 6.0" --notes "Windows installer" || gh release upload "app-v6.0" desktop/dist/Piano-Logger-Setup.exe --clobber
