name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Put the newest website page inside the app
        shell: bash
        run: cp index.html desktop/page/piano-logger.html
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          gh release create "app-v$V" desktop/dist/Piano-Logger-Setup.exe --latest --title "Piano Logger app $V" --notes "Windows installer for Windows 10 and 11 (64-bit and 32-bit)" || gh release upload "app-v$V" desktop/dist/Piano-Logger-Setup.exe --clobber
